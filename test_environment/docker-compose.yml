

services:
  db:
    image: postgres:15
    container_name: autoheal_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: ./app
    container_name: autoheal_app
    environment:
      DATABASE_URL: postgresql://admin:secret@db:5432/appdb
      FLASK_APP: app.py
      FLASK_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: on-failure

  nginx:
    image: nginx:latest
    container_name: autoheal_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: on-failure   

volumes:
  pgdata: